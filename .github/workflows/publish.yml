name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC): no long-lived NPM_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          registry-url: https://registry.npmjs.org

      - name: Verify version matches release tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          echo "package.json: $PKG_VERSION, release tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION). Tag the release on the commit that bumps the version."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      # The build stays on Node 16 (babel 6 toolchain); trusted publishing needs npm >= 11.5.1,
      # which needs a newer Node, so publishing switches runtime after the build.
      - name: Setup Node.js for publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: |
          npm install -g npm@11
          npm publish --access public --provenance
